repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: pnpm --dir frontend format
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
