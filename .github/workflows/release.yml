name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; only the release job below can write
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub release
      id-token: write # Sign the build provenance
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history, to check the tag is on main

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install
        run: uv sync --locked

      - name: Checks
        run: make check

      - name: Notes (fails unless the tag matches pyproject.toml and CHANGELOG.md)
        run: uv run python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md

      - name: Build wheel and sdist
        run: make build

      - name: Smoke test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "import pitwall; print(pitwall.__version__)" > installed.txt
          test "$(cat installed.txt)" = "${GITHUB_REF_NAME#v}"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --title "pitwall $GITHUB_REF_NAME" --notes-file notes.md
