version: 2
updates:
    - package-ecosystem: "uv"
      directory: "/"
      schedule:
        interval: "weekly"
      groups:
        python-deps:
            patterns: ["*"]

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
        interval: "weekly"

    - package-ecosystem: "npm" # also covers pnpm lockfiles
      directory: "/frontend"
      schedule:
        interval: "weekly"
      # matches minimumReleaseAge: CI installs from the lockfile, so pnpm's own check never sees these
      cooldown:
        default-days: 7
      groups:
        frontend-deps:
          patterns: ["*"]
