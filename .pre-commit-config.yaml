repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # prettier formats only the staged files; it runs from the repo root, so it is told where
      # frontend's ignore file is (its config file is found next to each file)
      - id: prettier
        name: prettier
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown --ignore-path frontend/.prettierignore
        language: system
        files: ^frontend/
      # eslint and tsc check the whole frontend, since a config change can affect every file
      - id: eslint
        name: eslint
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: pnpm --dir frontend typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
