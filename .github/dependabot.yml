version: 2
updates:
    - package-ecosystem: "uv"
      directory: "/"
      schedule:
        interval: "weekly"
      groups:
        python-deps:
            patterns: ["*"]

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
        interval: "weekly"

    - package-ecosystem: "npm" # also covers pnpm lockfiles
      directory: "/frontend"
      schedule:
        interval: "weekly"
      # matches minimumReleaseAge: CI installs from the lockfile, so pnpm's own check never sees these
      cooldown:
        default-days: 7
      groups:
        frontend-deps:
          patterns: ["*"]
      ignore:
        # typescript-eslint's peer range stops below TypeScript 6.1 (as of 8.72); revisit at each
        # phase review (docs/design/frontend.md, decision 1)
        - dependency-name: "typescript"
          update-types: ["version-update:semver-major", "version-update:semver-minor"]
        # the types follow the oldest Node we support (.nvmrc, 22): decision 12
        - dependency-name: "@types/node"
          update-types: ["version-update:semver-major"]
